# Copy to config/go2rtc.yaml (ignored by git) and replace CHANGE_ME with the camera password.
streams:
  # audio + video for the assistant, without the backchannel
  pokoj:
    - rtsp://admin:CHANGE_ME@192.168.50.23:554/h264Preview_01_sub#backchannel=0
  # separate stream for talking through the speaker (stage 2) + Opus audio for the browser
  pokoj_glosnik:
    - rtsp://admin:CHANGE_ME@192.168.50.23:554/h264Preview_01_sub
    - ffmpeg:pokoj_glosnik#audio=opus
